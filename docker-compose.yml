version: '3.8'

services:
  # ============================
  # DATABASES
  # ============================
  postgres-auth:
    image: postgres:15-alpine
    container_name: chefpack-postgres-auth
    environment:
      POSTGRES_DB: chefpack_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChefPack2024!Secure
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-orders:
    image: postgres:15-alpine
    container_name: chefpack-postgres-orders
    environment:
      POSTGRES_DB: chefpack_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChefPack2024!Secure
    ports:
      - "5433:5432"
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payments:
    image: postgres:15-alpine
    container_name: chefpack-postgres-payments
    environment:
      POSTGRES_DB: chefpack_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChefPack2024!Secure
    ports:
      - "5434:5432"
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-cooks:
    image: postgres:15-alpine
    container_name: chefpack-postgres-cooks
    environment:
      POSTGRES_DB: chefpack_cooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChefPack2024!Secure
    ports:
      - "5435:5432"
    volumes:
      - postgres-cooks-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # REDIS
  # ============================
  redis:
    image: redis:7-alpine
    container_name: chefpack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # MEILISEARCH
  # ============================
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: chefpack-meilisearch
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # API GATEWAY
  # ============================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: chefpack-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - redis
      - auth-service
      - users-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================
  # MICROSERVICES
  # ============================
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: chefpack-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    env_file:
      - .env
    depends_on:
      - postgres-auth
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: chefpack-users-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
    env_file:
      - .env
    depends_on:
      - postgres-auth
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-auth-data:
  postgres-orders-data:
  postgres-payments-data:
  postgres-cooks-data:
  redis-data:
  meilisearch-data:

